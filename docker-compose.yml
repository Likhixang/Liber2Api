services:
  liber2api:
    image: ghcr.io/likhixang/liber2api:latest
    container_name: liber2api
    restart: unless-stopped
    ports:
      # 仅供本机或宿主机 NPM/反代访问，绑定 127.0.0.1
      - "127.0.0.1:8035:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      # WebUI 管理密码
      - ADMIN_PASSWORD=lw.99529525
      # 可选：如果希望限制下游客户端调用，取消注释并设置 API_KEY
      # - API_KEY=sk-liber2api-secret
      # 429 触发后的冷却时间（小时），默认 5 小时
      - COOLDOWN_HOURS=5
      # 账号 Token 自动后台保活轮转周期（秒），默认 12 小时 (43200)
      - AUTO_REFRESH_INTERVAL=43200
      # 可选：接入 Resin 外部粘性代理网关，将账号网络请求固定到稳定节点与出口 IP
      # - RESIN_URL=http://127.0.0.1:2260/my-resin-token
      # - RESIN_PLATFORM_NAME=Default
    volumes:
      - ./data:/app/data
    networks:
      - docker_share

networks:
  docker_share:
    external: true
